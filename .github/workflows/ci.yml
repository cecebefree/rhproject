name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  guard:
    needs: [test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get install -y postgresql-client
      - name: Install Supabase CLI (pinned to local version 2.108.0)
        uses: supabase/setup-cli@v2
        with:
          version: 2.108.0
      - name: Create Supabase stubs
        run: |
          psql "$DATABASE_URL" -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE SCHEMA IF NOT EXISTS extensions;
            CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
            CREATE EXTENSION IF NOT EXISTS hstore WITH SCHEMA extensions;
            ALTER DATABASE postgres SET search_path TO public, extensions;
            CREATE TABLE IF NOT EXISTS auth.users (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              instance_id uuid,
              aud varchar(255),
              role varchar(255),
              email varchar(255),
              encrypted_password varchar(255),
              email_confirmed_at timestamptz,
              confirmed_at timestamptz,
              invited_at timestamptz,
              confirmation_token varchar(255),
              confirmation_sent_at timestamptz,
              recovery_token varchar(255),
              recovery_sent_at timestamptz,
              email_change_token_new varchar(255),
              email_change varchar(255),
              email_change_sent_at timestamptz,
              last_sign_in_at timestamptz,
              raw_app_meta_data jsonb,
              raw_user_meta_data jsonb,
              is_super_admin boolean,
              created_at timestamptz,
              updated_at timestamptz,
              phone text,
              phone_confirmed_at timestamptz,
              phone_change text,
              phone_change_token varchar(255),
              phone_change_sent_at timestamptz,
              email_change_token_current varchar(255),
              email_change_confirm_status smallint,
              banned_until timestamptz,
              reauthentication_token varchar(255),
              reauthentication_sent_at timestamptz,
              is_sso_user boolean,
              deleted_at timestamptz,
              is_anonymous boolean
            );
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid AS \$\$ SELECT gen_random_uuid() \$\$ LANGUAGE sql;
            CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb AS \$\$ SELECT '{}'::jsonb \$\$ LANGUAGE sql;
          "
          psql "$DATABASE_URL" -c "DO \$\$ BEGIN CREATE ROLE authenticated; EXCEPTION WHEN duplicate_object THEN END \$\$;"
          psql "$DATABASE_URL" -c "DO \$\$ BEGIN CREATE ROLE supabase_auth_admin; EXCEPTION WHEN duplicate_object THEN END \$\$;"
          psql "$DATABASE_URL" -c "GRANT USAGE ON SCHEMA public TO authenticated; GRANT SELECT ON ALL TABLES IN SCHEMA public TO authenticated;"
      - name: Bootstrap supabase_realtime publication
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'supabase_realtime') THEN
                CREATE PUBLICATION supabase_realtime;
              END IF;
            END \$\$;
          "
      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: bash scripts/ci/guard-ai-import.sh
      - run: bash scripts/ci/guard-cross-import.sh
      # guard-type-drift reactivated by operator ruling (quarantine lifted). Recipe:
      # supabase gen types typescript --db-url "$DATABASE_URL" --schema public (CLI 2.108.0).
      - run: bash scripts/ci/guard-type-drift.sh
      - run: bash supabase/guard-field-register.sh

  build:
    needs: [lint, typecheck, test, guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
